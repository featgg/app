# Local git hooks. Install with: lefthook install
# See README.md § Git hooks for setup.
# Commit-time checks stay fast (format + staged secret scan); the
# heavier analyze + test suite and a full-history secret scan run once
# per push instead of once per commit.
pre-commit:
  parallel: false
  commands:
    format:
      run: dart format --output=none --set-exit-if-changed .
      fail_text: "Dart files are not formatted. Run: dart format ."
    gitleaks:
      run: gitleaks protect --staged --redact --verbose
      fail_text: "gitleaks detected a potential secret in staged content. Review the redacted output above. To override in a genuine emergency, commit with --no-verify and open an issue."
pre-push:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks detect --redact --no-banner
      fail_text: "gitleaks detected a potential secret in the commit history about to be pushed. Review the redacted output above; do not push until it is resolved."
    analyze:
      run: flutter analyze
      fail_text: "flutter analyze reported issues."
    test:
      run: flutter test --exclude-tags golden
      fail_text: "flutter test failed."
