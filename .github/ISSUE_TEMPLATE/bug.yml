name: Bug report
description: Report a defect in the app's behavior.
title: "[bug] <one-line summary>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce. Reports
        without clear reproduction steps will be asked to refile.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a clean app state.
      placeholder: |
        1. Open the app fresh (logged out)
        2. Tap "Continue with email"
        3. Enter a valid email address
        4. Tap submit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen.
      placeholder: "OTP code input screen appears within 2 seconds of submitting."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens.
      placeholder: "Screen freezes for ~10 seconds, then shows a generic error toast."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Flutter version, platform, device, app version. Real device or emulator.
      placeholder: |
        - Flutter: 3.41.2
        - Platform: iOS 18.2
        - Device: iPhone 14 Pro (real device)
        - App version: 0.1.0 (build 12)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output, stack traces, screen recordings. Redact tokens or personal info before pasting.
    validations:
      required: false
  - type: checkboxes
    id: discipline
    attributes:
      label: Public-repo discipline
      options:
        - label: No backend paths, internal function names, schema namespaces, or backend env var names appear in this issue body or attachments.
          required: true
