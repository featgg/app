name: Epic
description: A large initiative that groups multiple sub-issues toward one milestone goal.
title: "[EPIC] EPIC-FE-<DOMAIN>: <one-line goal>"
body:
  - type: markdown
    attributes:
      value: |
        Use this template for epics that group several sub-issues. Each epic should
        have a clear first vertical slice gate that proves the whole stack works
        end-to-end. The body describes what the epic delivers, not how the decision
        was reached — discussion context belongs in PR descriptions or planning docs.
  - type: input
    id: epic-identifier
    attributes:
      label: Epic identifier
      description: Stable identifier used across commits, branches, and PR descriptions.
      placeholder: "EPIC-FE-AUTH"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the epic delivers in one short paragraph. End-user perspective.
      placeholder: "Login with email OTP, Google, and Discord; persistent session; auto-routing post-auth."
    validations:
      required: true
  - type: textarea
    id: scope-in
    attributes:
      label: Scope — in
      description: What is included. Bullet list.
      placeholder: |
        - Email OTP flow
        - Google OAuth flow
        - Session restoration
    validations:
      required: true
  - type: textarea
    id: scope-out
    attributes:
      label: Scope — out
      description: What is explicitly excluded so future contributors don't expand scope silently.
      placeholder: |
        - Apple Sign-In (deferred)
        - Magic-link auth
    validations:
      required: false
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-issues
      description: Checklist of sub-issues. Link them as they are filed.
      placeholder: |
        - [ ] #N — Email OTP entry screen
        - [ ] #N — OAuth providers
        - [ ] #N — Session restoration
    validations:
      required: false
  - type: textarea
    id: success-criteria
    attributes:
      label: Success criteria
      description: Checkbox list of what proves the epic is done. The first item must be the first vertical slice gate.
      placeholder: |
        - [ ] First vertical slice: email OTP → session → land on profile (gate)
        - [ ] All planned providers integrated
        - [ ] Session survives app restart
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: External or cross-epic blockers.
      placeholder: |
        - Depends on EPIC-FE-INFRA completion
        - Requires integration snapshot at app/docs/integration/
    validations:
      required: false
  - type: checkboxes
    id: discipline
    attributes:
      label: Public-repo discipline
      options:
        - label: No backend paths, internal function names, schema namespaces, or backend env var names appear in this issue body.
          required: true
