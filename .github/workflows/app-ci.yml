name: app-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Restore build_runner's incremental state so the build is incremental
      # instead of cold. build_runner re-hashes every input on restore and
      # regenerates only what changed, so a restored cache + new source stays
      # correct. The run_id suffix makes each run save a fresh baseline; the
      # restore-keys prefix matches the most recent cache for the same deps,
      # SDK, and generator config (busts when any of those hashes change).
      - name: Cache build_runner output
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .dart_tool/build
          key: build-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'build.yaml') }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'build.yaml') }}-

      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download and verify gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl --fail --location --silent --show-error --output "${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --status
          tar -xzf "${tarball}" gitleaks
          rm "${tarball}"
          ./gitleaks version

      - name: Run gitleaks
        run: ./gitleaks git --redact --verbose .
