name: featgg
description: "Official frontend application for Feat.gg. Powered by Flutter, Riverpod, and Supabase."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: "3.11.0"
  flutter: "3.41.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # i18n
  intl: 0.20.2

  # Backend
  supabase_flutter: 2.12.0

  # Auth — native Google sign-in (Discord stays browser-based)
  google_sign_in: 7.2.0

  # State management
  flutter_riverpod: 3.1.0
  riverpod_annotation: 4.0.0

  # Utilities
  fpdart: 1.2.0
  equatable: 2.0.8
  json_annotation: 4.9.0

  # Navigation
  go_router: 17.1.0

  # Observability
  sentry_flutter: 9.21.0

  # UI
  flutter_staggered_grid_view: 0.7.0
  cached_network_image: 3.4.1
  flutter_svg: 2.2.3
  google_fonts: 8.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: 6.0.0
  riverpod_lint: 3.1.0

  # Codegen
  build_runner: 2.10.5
  riverpod_generator: 4.0.0+1
  json_serializable: 6.11.1

flutter:
  uses-material-design: true
  generate: true
